[project]
name = "capacity-api"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "graphene>=3.4.3",
    "graphene-sqlalchemy>=3.0.0rc2",
    "gunicorn>=26.2.0",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-flask>=1.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
